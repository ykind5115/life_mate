<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>LifeMate</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!--
      单页应用：由 app.js 按 hash 切换视图。
      不用框架也不用构建步骤 —— 基础设施在 core.js（见它的文件头说明），
      为什么不上框架见 docs/16 决策 A。
      将来要换成 Preact/Next.js 时，这一层整体替换即可，API 与后端不用动。
    -->
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">LifeMate</span>
        </div>

        <nav class="nav">
          <a href="#/chat" data-nav="chat" title="对话">
            <span>💬</span><span class="nav-label">对话</span>
          </a>
          <a href="#/memories" data-nav="memories" title="记忆">
            <span>🧠</span><span class="nav-label">记忆</span>
          </a>
          <a href="#/timeline" data-nav="timeline" title="时间线">
            <span>📅</span><span class="nav-label">时间线</span>
          </a>
          <a href="#/graph" data-nav="graph" title="知识图谱">
            <span>🕸</span><span class="nav-label">知识图谱</span>
          </a>
          <a href="#/relations" data-nav="relations" title="人际关系">
            <span>👥</span><span class="nav-label">人际关系</span>
          </a>
          <a href="#/goals" data-nav="goals" title="目标">
            <span>🎯</span><span class="nav-label">目标</span>
          </a>
          <a href="#/review" data-nav="review" title="回顾">
            <span>📖</span><span class="nav-label">回顾</span>
          </a>
          <a href="#/settings" data-nav="settings" title="设置">
            <span>⚙️</span><span class="nav-label">设置</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div id="health" class="health">检查中…</div>
        </div>
      </aside>

      <main class="main">
        <!-- ==================== 对话 ==================== -->
        <section class="view" id="view-chat">
          <div class="chat-layout">
            <aside class="conv-list">
              <div class="conv-head">
                <span class="dim">历史会话</span>
                <button id="btn-new-chat" class="btn small">+ 新会话</button>
              </div>
              <div id="conversations" class="conv-scroll"></div>
            </aside>

            <div class="chat-main">
              <div id="messages" class="messages">
                <div class="empty">
                  <p>聊点什么吧。</p>
                  <p class="dim">你说的话会被后台整理成长期记忆，下次相关的时候它会自己想起来。</p>
                </div>
              </div>

              <form id="composer" class="composer">
                <!--
                  麦克风按钮：只有 STT 可用时才显示（见 app.js 的 refreshMicAvailability）。
                  语音是**可选的输入方式** —— 服务没起来时干脆不显示，
                  而不是让用户点一下、等半天、再报错。
                -->
                <button
                  type="button"
                  id="btn-mic"
                  class="btn mic hidden"
                  title="按一下开始说话，说完再按一下"
                  aria-label="语音输入"
                >
                  <span class="mic-icon">🎤</span>
                  <span id="mic-timer" class="mic-timer"></span>
                </button>
                <textarea
                  id="input"
                  rows="1"
                  placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
                ></textarea>
                <button type="submit" id="btn-send" class="btn primary">发送</button>
              </form>
            </div>

            <!--
              右侧栏：本会话派生出的记忆。
              此前「对话」与「记忆」是割裂的 —— 你在对话里说了一件事，
              想确认「它记住了吗」得切到记忆页手动搜。这里是同一件事的两半。
            -->
            <aside class="conv-list" style="width: 250px; flex: 0 0 250px; border-right: none; border-left: 1px solid var(--line)">
              <div class="conv-head"><span class="dim">这段对话记住了什么</span></div>
              <div id="chat-side" class="conv-scroll"></div>
            </aside>
          </div>
        </section>

        <!-- ==================== 记忆 ==================== -->
        <section class="view" id="view-memories">
          <header class="view-head">
            <h1>记忆</h1>
            <div class="head-actions">
              <input id="mem-search" class="input" placeholder="语义搜索…" style="width: 220px" />
              <select id="mem-view" class="input">
                <option value="current">当前有效</option>
                <option value="management">全部（含冲突/已归档/已否定）</option>
              </select>
              <button id="btn-create-memory" class="btn small">+ 添加</button>
            </div>
          </header>
          <div class="scroll">
            <div id="mem-list"></div>
          </div>
        </section>

        <!-- ==================== 时间线 ==================== -->
        <section class="view" id="view-timeline">
          <header class="view-head">
            <h1>时间线</h1>
            <div class="head-actions">
              <select id="tl-category" class="input">
                <option value="">全部分类</option>
              </select>
              <button id="btn-new-event" class="btn small">+ 补记一件事</button>
            </div>
          </header>
          <div class="scroll">
            <div id="tl-list"></div>
          </div>
        </section>

        <!-- ==================== 知识图谱 ==================== -->
        <section class="view" id="view-graph">
          <header class="view-head">
            <h1>知识图谱</h1>
            <div class="head-actions">
              <span class="dim">以你为圆心，连出人、事、目标与相关记忆</span>
            </div>
          </header>
          <div class="scroll">
            <div id="graph-box"></div>
          </div>
        </section>

        <!-- ==================== 人际关系 ==================== -->
        <section class="view" id="view-relations">
          <header class="view-head">
            <h1>人际关系</h1>
            <div class="head-actions">
              <input id="rel-search" class="input" placeholder="找人…" style="width: 160px" />
              <button id="btn-new-relation" class="btn small">+ 记下一个人</button>
            </div>
          </header>
          <div class="scroll">
            <div id="rel-list"></div>
          </div>
        </section>

        <!-- ==================== 目标 ==================== -->
        <section class="view" id="view-goals">
          <header class="view-head">
            <h1>目标</h1>
            <div class="head-actions">
              <button id="btn-new-goal" class="btn primary small">新增目标</button>
            </div>
          </header>
          <div class="scroll">
            <div id="goal-list"></div>
          </div>
        </section>

        <!-- ==================== 回顾 ==================== -->
        <section class="view" id="view-review">
          <header class="view-head">
            <h1>回顾</h1>
            <div class="head-actions">
              <select id="review-kind" class="input">
                <option value="week">这一周</option>
                <option value="month">这个月</option>
                <option value="day">今天</option>
                <option value="custom">自定义区间</option>
              </select>
              <button id="btn-review" class="btn primary small">生成回顾</button>
            </div>
          </header>
          <div class="scroll">
            <div id="review-custom" class="hidden" style="margin-bottom: 16px">
              <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap">
                <label style="margin: 0">
                  从
                  <input id="review-from" class="input" type="date" />
                </label>
                <label style="margin: 0">
                  到
                  <input id="review-to" class="input" type="date" />
                </label>
              </div>
            </div>
            <div id="review-out"></div>
          </div>
        </section>

        <!-- ==================== 设置 ==================== -->
        <section class="view" id="view-settings">
          <header class="view-head"><h1>设置</h1></header>
          <div class="scroll">
            <div id="settings-out"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
