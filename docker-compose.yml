services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lifemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 时区与编码固定下来，避免跨环境差异
      TZ: Asia/Shanghai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 只绑本机回环，不对局域网暴露
      - "127.0.0.1:5432:5432"
    volumes:
      # ⚠️ PostgreSQL 18 起官方镜像改了数据目录，不能再用 17 及以前的路径：
      #      PGDATA → /var/lib/postgresql/18/docker
      #      镜像声明的 VOLUME → /var/lib/postgresql
      #    挂到 /var/lib/postgresql/data 会导致容器启动失败（mount 报
      #    no such file or directory），或数据落进匿名卷、容器重建后静默丢失。
      # 依据：https://www.postgresql.org/message-id/6eec7166-3f56-4962-a015-719eef3dd964%40headcrashing.eu
      - lifemate-pgdata:/var/lib/postgresql
      - ./devops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  embedding:
    # ⚠️ 镜像标签必须匹配 GPU 计算能力，否则启动即失败：
    #      RTX 40 系（Ada Lovelace, sm_89） → 89-1.9   ← 当前使用
    #      RTX 30 系（Ampere,  sm_86）      → 86-1.9
    #      A100 / A30（Ampere, sm_80）      → 1.9
    #      H100（Hopper, sm_90）            → hopper-1.9
    #      无独显 / 排查用                    → cpu-1.9
    # 依据：https://github.com/huggingface/text-embeddings-inference README「Docker Images」
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9
    container_name: lifemate-embedding
    restart: unless-stopped

    # bge-m3：XLM-RoBERTa 架构，hidden_size=1024，8192 上下文
    #
    # 使用**宿主机已有的本地权重**，不从 HuggingFace 下载（见 .env 的 BGE_M3_MODEL_DIR）。
    # 这样既省去 2.3 GB 下载，也让模型文件完全不出网、不受网络波动影响。
    #
    # --pooling cls 是必须显式指定的：
    #   本地权重缺少 Sentence-Transformers 的 1_Pooling/config.json
    #   （只有 config.json / model.safetensors / tokenizer.json / tokenizer_config.json），
    #   TEI 无法从中推断池化方式，不指定会用到错误池化、向量质量下降。
    #   bge-m3 官方使用 CLS pooling。
    #
    # --max-client-batch-size 32：V1.0 计划用 batch=1（见审计报告 F-12，
    #   批量返回顺序未经验证），此处保留上限仅为不阻塞未来批量调用。
    command:
      - "--model-id"
      - "/data/models/bge-m3"
      - "--port"
      - "80"
      - "--pooling"
      - "cls"
      - "--max-client-batch-size"
      - "32"

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      # 本地模型目录挂载为只读：容器不需要写模型文件
      # ⚠️ 路径由 .env 的 BGE_M3_MODEL_DIR 提供 —— 两台机器的仓库根目录不同
      #    （家里 D:\workspace，公司 E:\workspace），因此不得硬编码（AGENTS.md §4.2）
      - type: bind
        source: ${BGE_M3_MODEL_DIR:?必须在 .env 中设置 BGE_M3_MODEL_DIR（见 .env.example）}
        target: /data/models/bge-m3
        read_only: true
      # 仍需一个可写卷给 HF_HOME：TEI 会在此写少量缓存/配置
      - lifemate-hf-cache:/data/hf

    environment:
      HF_HOME: /data/hf
      TZ: Asia/Shanghai
      # 强制 FP16：bge-m3 显存占用约 3.2 GB，8G 卡余量充足
      # 不设置时 TEI 可能用 FP32（本权重 config 里 dtype 就是 float32），显存翻倍
      DTYPE: float16

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================
  # 语音转文字（STT，docs/17 §3）
  # ------------------------------------------------------------
  # 你说的话 → 转成文字 → 你确认后发给现有的对话接口。
  # 只做「输入方式」，不做语音助手。
  #
  # 与 embedding 同一个模式：本地部署、只绑回环、用 GPU。
  # 音频因此不出这台机器 —— 这是选本地而不是浏览器 Web Speech 的理由
  # （后者在中文下依赖服务端识别，音频会离开本机）。
  # ============================================================
  stt:
    # 【镜像选择】
    #   latest-gpu                  用 openai-whisper（原版），最稳
    #   latest-gpu-faster-whisper   用 faster-whisper（CTranslate2），快 2~4 倍
    #
    # ⚠️ 换 faster-whisper 那版时**必须同时设 ASR_ENGINE=faster_whisper**，
    #    否则容器起来的服务与镜像里的引擎不一致，请求会失败。
    #
    # 默认选前者：少一个必须配对的变量 = 少一种起不来的方式。
    # 而 large-v3-turbo 本身已经比 large-v3 快很多，够用了。
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: lifemate-stt
    restart: unless-stopped

    environment:
      # large-v3-turbo：large-v3 的蒸馏版，中文质量与 large 接近而快得多。
      # 不用 medium —— 语音进来的错字会直接进记忆抽取，
      # 「张三」听成「张散」，那条记忆就永久错了。
      ASR_MODEL: large-v3-turbo
      # 中文。不设 auto：短音频（几秒钟的「嗯」「好」）做语种检测容易判错，
      # 可能被识别成日文或韩文。
      ASR_LANGUAGE: zh
      # 首次启动会从 HuggingFace 下载权重（约 1.6GB），之后复用缓存卷。
      HF_HOME: /data/hf
      TZ: Asia/Shanghai

    ports:
      # 与 postgres / embedding 一致：只绑本机回环
      #
      # 【为什么是 9090 而不是 9000】
      #   🔴 2026-10-13 实测：绑定 9000 直接失败 ——
      #      Error: ports are not available: exposing port TCP 127.0.0.1:9000:
      #        listen tcp4 127.0.0.1:9000: bind: An attempt was made to access
      #        a socket in a way forbidden by its access permissions.
      #
      #   注意报错**不是**「已被占用」，而是「权限不允许」。
      #   求证：`netsh int ipv4 show excludedportrange protocol=tcp` 显示
      #        8903 - 9002 是 Windows 的**端口保留段**
      #        （Hyper-V/WSL 的动态范围，Docker Desktop 用 WSL2 后端就会有）。
      #        而 `Get-NetTCPConnection -LocalPort 9000` 查不到任何监听者 ——
      #        没人在用，但 Windows 不让绑。
      #
      #   9090 不在任何保留段内（同类候选还有 9099/9100/9503/9600）。
      #   ⚠️ 保留段会随 WSL/Hyper-V 的启动变化。将来若又撞上，
      #      先跑上面那条 netsh 命令确认，再换一个不在段内的端口，
      #      同时改 STT_BASE_URL。
      - "127.0.0.1:9090:9000"

    volumes:
      # 模型权重缓存。删掉这个卷会让下次启动重新下载 1.6GB。
      - lifemate-stt-cache:/data/hf

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # ⚠️ 这个服务**没有 healthcheck**：
    #    容器提供的是 FastAPI 文档页（/docs），它对「模型是否加载完」不敏感，
    #    刚起来还没加载完模型时也会返回 200，做成健康检查会骗人。
    #    前端用 GET /api/v1/transcribe/status 判断可用性（那条会真的探 /docs），
    #    而「能不能转写」最终只能靠一次真实调用确认。

volumes:
  lifemate-pgdata:
  lifemate-hf-cache:
  lifemate-stt-cache:
